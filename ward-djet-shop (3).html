<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ward DJet Shop</title>
<style>
  :root{
    --bg:#100D18;
    --surface:#1B1729;
    --surface2:#241E38;
    --line:#332B4D;
    --text:#F3F0FA;
    --muted:#948DB0;
    --pink:#FF3E7F;
    --pink-dim:#7A1E3D;
    --gold:#F5A623;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;}
  h1,h2,h3,.display{font-family:'Archivo Black','Arial Black',sans-serif;letter-spacing:0.5px;}
  a{color:inherit;}

  /* --- header --- */
  header{position:sticky;top:0;z-index:40;background:rgba(16,13,24,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .headwrap{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;}
  .logo{display:flex;align-items:center;gap:10px;font-size:20px;text-transform:uppercase;}
  .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--pink);box-shadow:0 0 12px var(--pink);}
  .cart-btn{background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:999px;cursor:pointer;font-size:14px;display:flex;gap:8px;align-items:center;}
  .cart-btn:hover{border-color:var(--pink);}
  .cart-count{background:var(--pink);color:#1a0812;font-weight:800;border-radius:999px;padding:1px 8px;font-size:12px;}

  /* --- ticker --- */
  .ticker{overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--line);background:var(--surface);padding:8px 0;}
  .ticker span{display:inline-block;padding-right:40px;font-size:13px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
  .ticker-track{display:inline-block;animation:scroll 22s linear infinite;}
  @keyframes scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}

  /* --- hero --- */
  .hero{max-width:1100px;margin:0 auto;padding:64px 24px 40px;text-align:center;}
  .hero h1{font-size:clamp(38px,7vw,72px);margin:0 0 12px;line-height:0.95;}
  .hero h1 .accent{color:var(--pink);}
  .hero p{color:var(--muted);font-size:16px;max-width:520px;margin:0 auto 28px;}
  .bars{display:flex;gap:5px;justify-content:center;align-items:flex-end;height:44px;margin:0 auto 28px;}
  .bars i{display:block;width:5px;background:linear-gradient(180deg,var(--pink),var(--gold));border-radius:2px;animation:eq 1.1s ease-in-out infinite;}
  .bars i:nth-child(1){animation-delay:0s;height:14px;}
  .bars i:nth-child(2){animation-delay:0.1s;height:30px;}
  .bars i:nth-child(3){animation-delay:0.2s;height:44px;}
  .bars i:nth-child(4){animation-delay:0.3s;height:22px;}
  .bars i:nth-child(5){animation-delay:0.4s;height:36px;}
  .bars i:nth-child(6){animation-delay:0.5s;height:18px;}
  .bars i:nth-child(7){animation-delay:0.6s;height:28px;}
  @keyframes eq{0%,100%{transform:scaleY(0.4);}50%{transform:scaleY(1);}}
  .badge-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .badge{border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;padding:6px 14px;border-radius:999px;text-transform:uppercase;letter-spacing:1px;}
  .badge b{color:var(--gold);}

  /* --- grid --- */
  main{max-width:1100px;margin:0 auto;padding:20px 24px 100px;}
  .section-title{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0;}
  .section-title h2{font-size:22px;margin:0;}
  .section-title span{color:var(--muted);font-size:13px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .18s,border-color .18s;}
  .card:hover{transform:translateY(-4px);border-color:var(--pink);}
  .card .thumb{width:100%;aspect-ratio:1/1;background:var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .card .thumb img{width:100%;height:100%;object-fit:cover;}
  .card .info{padding:14px;}
  .card .name{font-size:14px;font-weight:600;margin:0 0 6px;line-height:1.3;}
  .card .price{color:var(--gold);font-weight:700;font-size:15px;}
  .card .tag{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;}

  .state-msg{color:var(--muted);text-align:center;padding:60px 20px;font-size:14px;}
  .state-msg.error{color:#ff8484;}
  .spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--pink);margin:0 auto 14px;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* --- windows / modals --- */
  .overlay{position:fixed;inset:0;background:rgba(8,6,14,0.75);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .overlay.open{display:flex;}
  .window{background:var(--surface);border:1px solid var(--line);border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;position:relative;}
  .window-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);}
  .window-bar .dots{display:flex;gap:6px;}
  .window-bar .dots i{width:10px;height:10px;border-radius:50%;display:block;}
  .window-bar .dots i:nth-child(1){background:#FF5F57;}
  .window-bar .dots i:nth-child(2){background:#FEBC2E;}
  .window-bar .dots i:nth-child(3){background:#28C840;}
  .window-bar .title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .close-x{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;}
  .close-x:hover{color:var(--pink);}
  .window-body{padding:20px;}
  .p-thumb{width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--surface2);margin-bottom:16px;}
  .p-thumb img{width:100%;height:100%;object-fit:cover;}
  .p-title{font-size:22px;margin:0 0 6px;}
  .p-price{font-size:20px;color:var(--gold);font-weight:800;margin:0 0 4px;}
  .p-included{font-size:12px;color:var(--muted);margin:0 0 18px;text-transform:uppercase;letter-spacing:1px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
  select{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px;}
  .qty-row{display:flex;align-items:center;gap:12px;}
  .qty-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:16px;cursor:pointer;}
  .qty-btn:hover{border-color:var(--pink);}
  .add-btn{width:100%;background:var(--pink);color:#1a0812;border:none;padding:15px;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;margin-top:6px;}
  .add-btn:hover{background:#ff5c8f;}
  .add-btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;}

  /* cart window */
  .cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .cart-item img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--surface2);}
  .cart-item .ci-info{flex:1;}
  .cart-item .ci-name{font-size:13px;margin:0 0 4px;}
  .cart-item .ci-meta{font-size:12px;color:var(--muted);margin:0 0 6px;}
  .cart-item .ci-price{font-size:13px;color:var(--gold);font-weight:700;}
  .cart-item .ci-remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;text-decoration:underline;}
  .cart-item .ci-remove:hover{color:#ff8484;}
  .cart-total-row{display:flex;justify-content:space-between;padding:14px 0;font-size:14px;color:var(--muted);}
  .cart-total-row.big{font-size:19px;color:var(--text);font-weight:800;border-top:1px solid var(--line);margin-top:8px;padding-top:16px;}
  .empty-cart{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}

  footer{border-top:1px solid var(--line);padding:30px 24px;text-align:center;color:var(--muted);font-size:12px;}
</style>
</head>
<body>

<header>
  <div class="headwrap">
    <div class="logo"><span class="dot"></span> Ward DJet Shop</div>
    <button class="cart-btn" onclick="openCart()">Panier <span class="cart-count" id="cartCount">0</span></button>
  </div>
</header>

<div class="ticker"><div class="ticker-track" id="tickerTrack"></div></div>

<div class="hero">
  <div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <h1>WARD <span class="accent">DJET</span> SHOP</h1>
  <p>Merch officiel, direct du studio. T-shirts et accessoires imprimés à la demande.</p>
  <div class="badge-row">
    <div class="badge">Livraison <b>incluse</b></div>
    <div class="badge">TVA <b>incluse</b></div>
    <div class="badge">Impression à la demande</div>
  </div>
</div>

<main>
  <div class="section-title">
    <h2>La collection</h2>
    <span id="countLabel"></span>
  </div>
  <div id="grid" class="grid"></div>
</main>

<footer>Ward DJet Shop — merch imprimé à la demande via Printful.</footer>

<!-- fenêtre produit -->
<div class="overlay" id="productOverlay" onclick="if(event.target===this)closeProduct()">
  <div class="window">
    <div class="window-bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="title">fiche produit</div>
      <button class="close-x" onclick="closeProduct()">&times;</button>
    </div>
    <div class="window-body" id="productBody"></div>
  </div>
</div>

<!-- fenêtre panier -->
<div class="overlay" id="cartOverlay" onclick="if(event.target===this)closeCart()">
  <div class="window">
    <div class="window-bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="title">panier</div>
      <button class="close-x" onclick="closeCart()">&times;</button>
    </div>
    <div class="window-body" id="cartBody"></div>
  </div>
</div>

<script>
/* ================= CONFIGURATION ================= */
const PRINTFUL_TOKEN = "UDU9tetkTzbrGmYCA4Hz8dAMFTePb2RHJlvDOC5d";
// Prix affiché = prix de vente Printful (déjà TTC côté boutique) + forfait livraison ci-dessous.
const SHIPPING_FLAT = 4.90; // € — forfait livraison inclus dans le prix affiché
const CURRENCY = "€";
// L'API Printful ne renvoie pas d'en-têtes CORS : un appel direct depuis le
// navigateur échoue toujours. On passe par corsproxy.io, qui transmet le
// header Authorization jusqu'à Printful.
// SANS clé (CORSPROXY_KEY = ""), ça ne marche QUE en localhost / ouverture
// locale du fichier. Pour que ça marche une fois le site en ligne (ton vrai
// nom de domaine), il faut une clé gratuite :
//   1. https://corsproxy.io -> Sign up (gratuit, aucune carte requise)
//   2. Dashboard -> Add domain -> mets le domaine où sera hébergé ce fichier
//   3. Copie la clé API et colle-la ci-dessous
const CORSPROXY_KEY = ""; // colle ta clé corsproxy.io ici une fois le site en ligne
const PUBLIC_PROXY = (url) => "https://corsproxy.io/?url=" + encodeURIComponent(url) + (CORSPROXY_KEY ? "&key=" + CORSPROXY_KEY : "");

let PRODUCTS = [];
let CART = []; // {variantId, productId, name, image, size, color, price, qty}
let lastFetchError = "";

/* ================= FETCH PRINTFUL ================= */
async function pfFetch(path){
  const url = "https://api.printful.com" + path;
  const target = PUBLIC_PROXY(url);
  let r;
  try{
    r = await fetch(target, { headers: { "Authorization": "Bearer " + PRINTFUL_TOKEN } });
  }catch(e){
    lastFetchError = "réseau injoignable (" + (e.message || e) + ")";
    throw new Error(lastFetchError);
  }
  if(!r.ok){
    lastFetchError = "HTTP " + r.status + (r.status === 401 ? " — token API invalide, ou proxy sans clé hors localhost (voir CORSPROXY_KEY en haut du script)" : "");
    throw new Error(lastFetchError);
  }
  const data = await r.json();
  if(data && data.error){
    lastFetchError = data.error.message || JSON.stringify(data.error);
    throw new Error(lastFetchError);
  }
  return data;
}

async function loadProducts(){
  const grid = document.getElementById("grid");
  grid.innerHTML = '<div class="state-msg" style="grid-column:1/-1"><div class="spinner"></div>Chargement de la collection…</div>';
  try{
    const list = await pfFetch("/store/products");
    const items = (list && list.result) || [];
    if(items.length === 0){
      grid.innerHTML = '<div class="state-msg" style="grid-column:1/-1">Aucun produit synchronisé dans le store Printful pour le moment.</div>';
      document.getElementById("countLabel").textContent = "";
      return;
    }
    // détail de chaque produit pour récupérer variantes + prix
    const details = await Promise.all(items.map(p => pfFetch("/store/products/" + p.id).catch(() => null)));
    PRODUCTS = details.filter(Boolean).map(d => {
      const sp = d.result.sync_product;
      const variants = d.result.sync_variants || [];
      return {
        id: sp.id,
        name: sp.name,
        thumbnail: sp.thumbnail_url,
        variants: variants.map(v => ({
          id: v.id,
          name: v.name,
          size: v.size || "",
          color: v.color || "",
          price: parseFloat(v.retail_price || 0),
          image: (v.files && v.files.find(f => f.type === "preview"))?.preview_url || sp.thumbnail_url,
          inStock: v.availability_status !== "discontinued"
        }))
      };
    }).filter(p => p.variants.length > 0);
    renderGrid();
    renderTicker();
  }catch(e){
    grid.innerHTML = '<div class="state-msg error" style="grid-column:1/-1">Impossible de charger le catalogue Printful.<br><span style="font-size:12px">'+ escapeHtml(e.message || lastFetchError || "erreur inconnue") +'</span><br><br>Vérifie que le token est correct et que la boutique Printful contient bien des produits synchronisés.</div>';
    document.getElementById("countLabel").textContent = "";
  }
}

function cheapestPrice(product){
  return Math.min(...product.variants.map(v => v.price)) + SHIPPING_FLAT;
}

function renderGrid(){
  const grid = document.getElementById("grid");
  document.getElementById("countLabel").textContent = PRODUCTS.length + " article" + (PRODUCTS.length>1?"s":"");
  grid.innerHTML = PRODUCTS.map(p => `
    <div class="card" onclick="openProduct(${p.id})">
      <div class="thumb"><img src="${p.thumbnail}" alt="${escapeHtml(p.name)}" loading="lazy"></div>
      <div class="info">
        <p class="tag">Livraison + TVA incluses</p>
        <p class="name">${escapeHtml(p.name)}</p>
        <p class="price">à partir de ${cheapestPrice(p).toFixed(2)} ${CURRENCY}</p>
      </div>
    </div>
  `).join("");
}

function renderTicker(){
  const names = PRODUCTS.map(p => p.name.toUpperCase()).join("  ★  ");
  const track = document.getElementById("tickerTrack");
  track.innerHTML = `<span>${names}</span><span>${names}</span>`;
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ================= FENÊTRE PRODUIT ================= */
let currentProduct = null;
let currentQty = 1;

function openProduct(id){
  currentProduct = PRODUCTS.find(p => p.id === id);
  if(!currentProduct) return;
  currentQty = 1;
  renderProductWindow();
  document.getElementById("productOverlay").classList.add("open");
}
function closeProduct(){
  document.getElementById("productOverlay").classList.remove("open");
}

function renderProductWindow(){
  const p = currentProduct;
  const body = document.getElementById("productBody");
  const options = p.variants.map(v => `<option value="${v.id}">${escapeHtml(v.name)} — ${v.price.toFixed(2)} ${CURRENCY}</option>`).join("");
  body.innerHTML = `
    <div class="p-thumb"><img id="pImg" src="${p.variants[0].image}" alt="${escapeHtml(p.name)}"></div>
    <h3 class="p-title">${escapeHtml(p.name)}</h3>
    <p class="p-price" id="pPrice">${(p.variants[0].price + SHIPPING_FLAT).toFixed(2)} ${CURRENCY}</p>
    <p class="p-included">Livraison incluse · TVA incluse</p>
    <div class="field">
      <label>Choisir une variante</label>
      <select id="variantSelect" onchange="onVariantChange()">${options}</select>
    </div>
    <div class="field">
      <label>Quantité</label>
      <div class="qty-row">
        <button class="qty-btn" onclick="changeQty(-1)">−</button>
        <span id="qtyLabel">1</span>
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>
    </div>
    <button class="add-btn" id="addBtn" onclick="addToCart()">Ajouter au panier</button>
  `;
}
function onVariantChange(){
  const sel = document.getElementById("variantSelect");
  const v = currentProduct.variants.find(v => String(v.id) === sel.value);
  document.getElementById("pImg").src = v.image;
  document.getElementById("pPrice").textContent = (v.price + SHIPPING_FLAT).toFixed(2) + " " + CURRENCY;
  document.getElementById("addBtn").disabled = !v.inStock;
  document.getElementById("addBtn").textContent = v.inStock ? "Ajouter au panier" : "Rupture de stock";
}
function changeQty(delta){
  currentQty = Math.max(1, currentQty + delta);
  document.getElementById("qtyLabel").textContent = currentQty;
}
function addToCart(){
  const sel = document.getElementById("variantSelect");
  const v = currentProduct.variants.find(v => String(v.id) === sel.value);
  if(!v || !v.inStock) return;
  const existing = CART.find(c => c.variantId === v.id);
  if(existing){
    existing.qty += currentQty;
  }else{
    CART.push({
      variantId: v.id,
      productId: currentProduct.id,
      name: currentProduct.name + (v.name ? " — " + v.name : ""),
      image: v.image,
      price: v.price + SHIPPING_FLAT,
      qty: currentQty
    });
  }
  updateCartCount();
  closeProduct();
  openCart();
}

/* ================= FENÊTRE PANIER ================= */
function updateCartCount(){
  const n = CART.reduce((s,c) => s + c.qty, 0);
  document.getElementById("cartCount").textContent = n;
}
function openCart(){
  renderCartWindow();
  document.getElementById("cartOverlay").classList.add("open");
}
function closeCart(){
  document.getElementById("cartOverlay").classList.remove("open");
}
function removeFromCart(variantId){
  CART = CART.filter(c => c.variantId !== variantId);
  updateCartCount();
  renderCartWindow();
}
function renderCartWindow(){
  const body = document.getElementById("cartBody");
  if(CART.length === 0){
    body.innerHTML = '<div class="empty-cart">Ton panier est vide.<br>Ajoute un article depuis la collection.</div>';
    return;
  }
  const total = CART.reduce((s,c) => s + c.price*c.qty, 0);
  body.innerHTML = CART.map(c => `
    <div class="cart-item">
      <img src="${c.image}" alt="">
      <div class="ci-info">
        <p class="ci-name">${escapeHtml(c.name)}</p>
        <p class="ci-meta">Qté ${c.qty}</p>
        <p class="ci-price">${(c.price*c.qty).toFixed(2)} ${CURRENCY}</p>
        <button class="ci-remove" onclick="removeFromCart(${c.variantId})">retirer</button>
      </div>
    </div>
  `).join("") + `
    <div class="cart-total-row"><span>Livraison</span><span>incluse</span></div>
    <div class="cart-total-row"><span>TVA</span><span>incluse</span></div>
    <div class="cart-total-row big"><span>Total</span><span>${total.toFixed(2)} ${CURRENCY}</span></div>
    <button class="add-btn" onclick="checkout()">Passer commande</button>
  `;
}
function checkout(){
  const total = CART.reduce((s,c) => s + c.price*c.qty, 0);
  const lines = CART.map(c => `- ${c.name} x${c.qty} — ${(c.price*c.qty).toFixed(2)} ${CURRENCY}`).join("%0D%0A");
  const body = `Commande Ward DJet Shop%0D%0A%0D%0A${lines}%0D%0A%0D%0ATotal (livraison + TVA incluses) : ${total.toFixed(2)} ${CURRENCY}`;
  window.location.href = `mailto:?subject=${encodeURIComponent("Commande Ward DJet Shop")}&body=${body}`;
}

document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ closeProduct(); closeCart(); }
});

loadProducts();
</script>
</body>
</html>
