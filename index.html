<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ward DJet Shop</title>
<style>
:root{--bg:#000;--bg2:#0d0d10;--bg3:#16161b;--line:#2a2a33;--txt:#f5f5f7;--mut:#9b9ba8;--a:#ff3d81;--b:#7c5cff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,Segoe UI,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:24px;padding:0 20px;height:64px;border-bottom:1px solid var(--line);background:#000;flex:none}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em}.logo i{font-style:normal;color:var(--a)}
nav{display:flex;gap:6px;margin-left:auto}
nav button{background:none;border:0;color:var(--mut);padding:10px 16px;border-radius:99px;cursor:pointer;font-weight:700;font-size:15px}
nav button:hover{color:#fff}
nav button.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
main{flex:1;min-height:0;position:relative}
.tab{display:none;height:100%;overflow:auto}.tab.on{display:block}
iframe{width:100%;height:100%;border:0;background:#000}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--mut);font-size:26px;font-weight:700}
.empty span{display:block;font-size:64px;margin-bottom:10px}
.wrap{max-width:1160px;margin:auto;padding:30px 20px}
h2{font-size:34px;margin-bottom:6px}
.sub{color:var(--mut);margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-3px);border-color:var(--a)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#fff;display:block}
.card div{padding:12px 14px}.card b{display:block}.card small{color:var(--mut)}
.btn{border:0;border-radius:12px;padding:12px 22px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.btn:hover{filter:brightness(1.12)}.btn.ghost{background:none;border:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card .pr{display:block;font-weight:800;font-size:18px;margin-top:6px;color:var(--txt)}.card .pr small{font-weight:400;font-size:12px;color:var(--mut)}.card .pr.ld{font-size:14px;font-weight:600;color:var(--mut)}
.cartbtn{background:#fff;color:#000;border:0;border-radius:99px;padding:9px 18px;font-weight:700;cursor:pointer}
.cartbtn b{background:var(--a);color:#fff;border-radius:99px;padding:1px 8px;margin-left:6px;font-size:13px}
.modal{position:fixed;inset:0;background:#000c;display:none;place-items:center;z-index:50;padding:16px}
.modal.on{display:grid}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:18px;max-width:820px;width:100%;max-height:92vh;overflow:auto;padding:22px;position:relative}
.x{position:absolute;right:14px;top:10px;background:none;border:0;color:#fff;font-size:28px;cursor:pointer}
.det{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.det img{width:100%;border-radius:12px;background:#fff}
select,input{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:#fff;margin:6px 0 12px}
.price{font-size:26px;font-weight:800;margin:8px 0}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row img{width:54px;height:54px;border-radius:8px;object-fit:cover;background:#fff}.row div{flex:1}
.row button{background:none;border:1px solid var(--line);color:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{padding:14px;border-radius:12px;background:var(--bg3);color:var(--mut)}.err{color:#ff6b8b}
@media(max-width:700px){.det{grid-template-columns:1fr}header{flex-wrap:wrap;height:auto;padding:10px 14px}nav{margin-left:0;width:100%;overflow:auto}}
</style>
</head>
<body>
<header>
  <div class="logo">Ward <i>DJet</i> Shop</div>
  <nav>
    <button data-t="stickers" class="on">Mon Stickers Est.net</button>
    <button data-t="vetements">Vêtements</button>
    <button data-t="jeux">Jeux</button>
  </nav>
  <button class="cartbtn" id="openCart">Panier<b id="cnt">0</b></button>
</header>
<main>
  <section class="tab on" id="stickers"><iframe id="fr" title="Mon Stickers Est.net"></iframe></section>

  <section class="tab" id="vetements"><div class="wrap">
    <div class="top"><div><h2>Vêtements</h2><p class="sub">Boutique Ward DJet — impression à la demande</p></div>
    </div>
    <div id="list" class="grid"></div>
  </div></section>

  <section class="tab" id="jeux"><div class="wrap">
    <div class="top"><div><h2>Jeux</h2><p class="sub">Téléchargement après paiement — pas de livraison</p></div></div>
    <div id="glist" class="grid"><div class="msg">Chargement…</div></div>
  </div></section>
</main>

<div class="modal" id="mProd"><div class="box"><button class="x" data-close>×</button><div id="prodBody"></div></div></div>

function stkSrc(){return stkHTML().replace("const openCart=()=>{","const openCart=()=>{try{if(window.parent&&window.parent.openUnified){window.parent.openUnified();return}}catch(e){}")}
function reloadStk(){stkDirty=false;$('#fr').srcdoc=stkSrc()}
var stkDirty=false;
function stkQty(){try{return Object.values(JSON.parse(localStorage.getItem('mse_cart')||'{}')).reduce((a,b)=>a+(+b||0),0)}catch(e){return 0}}
const stkHTML=()=>new TextDecoder().decode(Uint8Array.from(atob(STK),c=>c.charCodeAt(0)));
const fmt=(n,c)=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:c||'EUR'}).format(n);
// Livraison INCLUSE dans le prix (par article). Modifie ces montants selon les tarifs Printful.
const SHIP_INC={EU:5.90,GB:7.90,US:7.90,ROW:11.90};
const EU_C=['FR','BE','NL','LU','DE','IT','ES','PT','AT','IE','FI','SE','DK','PL','CZ','SK','SI','HR','HU','RO','BG','GR','EE','LV','LT','CY','MT'];
const zoneOf=c=>{c=(c||'FR').trim().toUpperCase();return EU_C.includes(c)?'EU':(c==='GB'?'GB':(c==='US'?'US':'ROW'))};
const shipItem=c=>SHIP_INC[zoneOf(c)];
let cart=[];try{cart=JSON.parse(localStorage.getItem('wds_cart')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('wds_cart',JSON.stringify(cart))}catch(e){}$('#cnt').textContent=cart.reduce((a,i)=>a+i.q,0)+stkQty()+gQty()};

// Onglets
let loadedV=false;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button,.tab').forEach(e=>e.classList.remove('on'));
  b.classList.add('on');$('#'+b.dataset.t).classList.add('on');
  
  if(b.dataset.t==='stickers'&&stkDirty)reloadStk();
  if(b.dataset.t==='vetements'&&!loadedV){loadedV=true;loadProducts()}
  if(b.dataset.t==='jeux'&&!loadedG){loadedG=true;loadGames()}
});
$('#fr').srcdoc=stkSrc();
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('on'));
document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('on')});

// Produits Printful
const fetchT=async(u,o,ms=9000)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{return await fetch(u,{...o,signal:c.signal})}finally{clearTimeout(t)}};
async function api(p,opt={}){
  const url='https://api.printful.com'+p,isGet=!opt.method||opt.method==='GET';
  const o={...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+TOKEN}};
  const tries=PROXIES.map((f,i)=>({i,run:()=>fetchT(f(url),o)}));
  tries.push({i:-1,run:()=>{if(!window.puter||!puter.net||!puter.net.fetch)throw new Error('puter indisponible');return puter.net.fetch(url,o)}});
  const start=Math.max(0,tries.findIndex(t=>t.i===px));
  let last=new Error('Aucun proxy disponible');
  for(let n=0;n<tries.length;n++){
    const t=tries[(start+n)%tries.length];
    try{
      const r=await t.run(),txt=await r.text();
      let j;try{j=JSON.parse(txt)}catch(e){throw new Error('Réponse proxy invalide')}
      if(!r.ok){const er=new Error(j.error?.message||j.error||r.status);er.api=true;throw er}
      px=t.i;
      if(isGet)try{localStorage.setItem('wds_c_'+p,txt)}catch(e){}
      return j;
    }catch(e){if(e.api)throw e;last=e}
  }
  if(isGet){try{const c=localStorage.getItem('wds_c_'+p);if(c){const j=JSON.parse(c);j.__stale=true;return j}}catch(e){}}
  throw last;
}
const PD={};
async function loadPrices(list){
  let k=0;
  const w=async()=>{while(k<list.length){
    const p=list[k++],el=()=>document.querySelector('.pr[data-p="'+p.id+'"]');
    for(let t=0;t<3;t++){
      try{
        const r=PD[p.id]||(PD[p.id]=await api('/store/products/'+p.id)),vs=r.result.sync_variants,pr=vs.map(v=>+v.retail_price),mn=Math.min(...pr),mx=Math.max(...pr);
        const e=el();if(e){e.classList.remove('ld');e.innerHTML=(mn===mx?'':'dès ')+fmt(mn+SHIP_INC.EU,vs[0].currency)+' <small>livraison incluse</small>'}
        break;
      }catch(err){delete PD[p.id];if(t<2)await new Promise(r=>setTimeout(r,700*(t+1)))}
    }
    const e=el();if(e&&e.classList.contains('ld'))e.textContent='Voir le prix';
  }};
  await Promise.all([w(),w(),w(),w()]);
}
async function loadProducts(){
  const L=$('#list');L.innerHTML='<div class="msg">Chargement…</div>';
  try{
    const j=await api('/store/products?limit=100');
    if(!j.result.length){L.innerHTML='<div class="msg">Aucun produit dans la boutique Printful pour l\'instant.</div>';return}
    L.innerHTML=j.result.map(p=>`<div class="card" data-id="${p.id}"><img src="${p.thumbnail_url||''}" alt="" loading="lazy"><div><b>${esc(p.name)}</b><small>${p.variants} variante(s)</small><span class="pr ld" data-p="${p.id}">Prix…</span></div></div>`).join('');
    loadPrices(j.result);
    L.querySelectorAll('.card').forEach(c=>c.onclick=()=>openProd(c.dataset.id));
  }catch(e){L.innerHTML=`<div class="msg err">Erreur API Printful : ${esc(e.message)}<br><small>Tous les proxys ont échoué, réessaie dans un instant.</small></div>`}
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const prevOf=v=>(v.files||[]).find(f=>f.type==='preview')?.preview_url||v.product?.image||'';

  $('#mProd').classList.add('on');$('#prodBody').innerHTML='<div class="msg">Chargement…</div>';
  try{
    const {result}=PD[id]||(PD[id]=await api('/store/products/'+id));

// ===== Jeux : catalogue Firestore (collection "games" : name, price, img, desc, url) =====
let gProducts=[],gLoaded=false,loadedG=false;
const readG=()=>{try{return JSON.parse(localStorage.getItem('wds_games')||'{}')}catch(e){return{}}};
const writeG=o=>{try{localStorage.setItem('wds_games',JSON.stringify(o))}catch(e){}save()};
function gQty(){return Object.keys(readG()).length}
function gLines(){const c=readG();return Object.keys(c).map(id=>gProducts.find(p=>p.id===id)).filter(Boolean)}
function gTot(){return Math.round(gLines().reduce((a,p)=>a+(+p.price||0),0)*100)/100}
async function loadG(force){
  if(gLoaded&&!force)return;
  const F=await getFB();if(!F)throw new Error('Firestore indisponible');
  const q=await F.getDocs(F.collection(F.db,'games'));
  gProducts=q.docs.map(d=>{const x=d.data();return{id:d.id,...x,img:x.img||x.image||x.thumbnail||'',desc:x.desc||x.description||''}});gLoaded=true;
}
async function loadGames(){
  const L=$('#glist');L.innerHTML='<div class="msg">Chargement…</div>';
  try{await loadG(true)}catch(e){L.innerHTML=`<div class="msg err">Catalogue jeux indisponible : ${esc(e.message)}</div>`;loadedG=false;return}
  if(!gProducts.length){L.innerHTML='<div class="msg">Pas de jeux pour l\'instant 🎮</div>';return}
  renderGames();
}
function renderGames(){
  const c=readG();
  $('#glist').innerHTML=gProducts.map(p=>`<div class="card" style="cursor:default">${p.img?`<img src="${esc(p.img)}" alt="" loading="lazy">`:''}<div><b>${esc(p.name||'Jeu')}</b><small>${esc(p.desc)}</small><span class="pr">${fmt(+p.price||0)} <small>téléchargement</small></span><button class="btn" style="width:100%;margin-top:8px" data-g="${esc(p.id)}" ${c[p.id]?'disabled':''}>${c[p.id]?'Dans le panier':'Ajouter au panier'}</button></div></div>`).join('');
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const c=readG();c[b.dataset.g]=1;writeG(c);renderGames();renderCart();$('#mCart').classList.add('on')});
}

// ===== Panier COMMUN : stickers + vêtements (+ jeux plus tard) — un seul paiement PayPal =====
const FV={cn:'',ce:'',cp:'',ca:'',cz:'',cc:'',cy:'FR'};
const unit=i=>i.price+shipItem(FV.cy);
const cartTot=()=>cart.reduce((a,i)=>a+unit(i)*i.q,0);
const cartShip=()=>cart.reduce((a,i)=>a+shipItem(FV.cy)*i.q,0);
const r2=n=>Math.round(n*100)/100;
const fbBase=new Promise(r=>{window.__fbr=r});
const getFB=()=>Promise.race([fbBase,new Promise(r=>setTimeout(()=>r(null),12000))]);
// Stickers : même catalogue Firestore et mêmes tarifs La Poste que Mon Stickers Est.net
let kProducts=[],KS={freeFrom:20,pkgG:10,stkG:4},KT={fr:.5,int:2.8},kLoaded=false,kTrack=false;
let KR={fr:[[20,1.52],[100,3.10],[250,5.24],[500,7.41],[1000,9.29],[2000,11.14]],int:[[20,2.25],[100,4.85],[250,11.65],[500,16.60],[1000,31.70],[2000,31.70]]};
const FR_Z=['FR','MC','AD','GP','MQ','GF','RE','YT','PM','BL','MF','WF','PF','NC'];
const kZone=()=>FR_Z.includes(FV.cy.trim().toUpperCase())?'fr':'int';
const readK=()=>{try{return JSON.parse(localStorage.getItem('mse_cart')||'{}')}catch(e){return{}}};
const writeK=o=>{try{localStorage.setItem('mse_cart',JSON.stringify(o))}catch(e){}stkDirty=true;save()};
function kPost(w,z){const t=KR[z];let tot=0;while(w>0){const part=Math.min(w,2000);tot+=t.find(r=>part<=r[0])[1];w-=part}return r2(tot)}
async function loadK(force){
  if(kLoaded&&!force)return;
  const F=await getFB();if(!F)throw new Error('Firestore indisponible');
  try{const d=await F.getDoc(F.doc(F.db,'settings','shop'));if(d.exists()){const s0=d.data();KS={...KS,...s0};if(s0.rates)KR={...KR,...s0.rates};if(s0.trackFr!=null&&s0.trackFr!=='')KT.fr=+s0.trackFr;if(s0.trackInt!=null&&s0.trackInt!=='')KT.int=+s0.trackInt}}catch(e){}
  KS.pkgG=+KS.pkgG||10;KS.stkG=+KS.stkG||4;
  const q=await F.getDocs(F.collection(F.db,'products'));
  kProducts=q.docs.map(d=>({id:d.id,...d.data()}));kLoaded=true;
}
function kTotals(){
  const c=readK();let n=0,sub=0;const lines=[];
  for(const id in c){const p=kProducts.find(x=>x.id===id);if(!p)continue;n+=c[id];sub+=c[id]*p.price;lines.push({p,q:c[id]})}
  const z=kZone(),w=n>0?KS.pkgG+KS.stkG*n:0,free=z==='fr'&&n>=KS.freeFrom;
  const ship=n===0||free?0:kPost(w,z),tkp=n>0?r2(Math.max(1,Math.ceil(w/2000))*KT[z]):0;
  return {n,sub:r2(sub),lines,z,w,ship,tkp,tk:kTrack?tkp:0};
}
const grandTotal=()=>{const T=kTotals();return r2((cart.length?cartTot():0)+(T.n?T.sub+T.ship+T.tk:0)+gTot())};
function updTotal(){
  if(!$('#tot'))return;
  const T=kTotals(),cT=cart.length?cartTot():0,d=[];
  document.querySelectorAll('[data-u]').forEach(e=>{const i=cart[e.dataset.u];if(i)e.textContent=fmt(unit(i),i.cur)});
  if(cart.length)d.push('Vêtements '+fmt(cT)+' (livraison incluse)');
  if(gLines().length)d.push('Jeux '+fmt(gTot()));
  if(T.n)d.push('Stickers '+fmt(T.sub)+' + livraison La Poste '+(T.ship?fmt(T.ship):'offerte')+(T.tk?' + suivi '+fmt(T.tk):''));
  $('#tot').textContent='Total : '+fmt(grandTotal());$('#det').textContent=d.join(' · ');
}
function openUnified(){renderCart();$('#mCart').classList.add('on')}
async function renderCart(){
  const B=$('#cartBody');let kErr='';
  const ids=Object.keys(readK());
  if(ids.length&&(!kLoaded||ids.some(id=>!kProducts.find(p=>p.id===id)))){
    B.innerHTML='<div class="msg">Chargement…</div>';
    try{await loadK(true)}catch(e){kErr='Catalogue stickers indisponible : '+e.message}
  }
  const gids=Object.keys(readG());
  if(gids.length&&(!gLoaded||gids.some(id=>!gProducts.find(p=>p.id===id)))){try{await loadG(true)}catch(e){kErr+=(kErr?' · ':'')+'Catalogue jeux indisponible : '+e.message}}
  const T=kTotals();
  if(!cart.length&&!T.n&&!gLines().length){B.innerHTML=kErr?`<div class="msg err">${esc(kErr)}</div>`:'<p class="sub" style="margin-top:10px">Panier vide.</p>';return}
  B.innerHTML=cart.map((i,k)=>`<div class="row"><img src="${i.img}" alt=""><div><b>${esc(i.name)}</b><br><small data-u="${k}"></small> <small>livraison incluse</small></div>
    <button data-m="${k}">−</button><span>${i.q}</span><button data-p="${k}">+</button></div>`).join('')+
  T.lines.map(l=>`<div class="row"><img src="${l.p.img}" alt=""><div><b>${esc(l.p.name)}</b><br><small>${fmt(+l.p.price)} · sticker</small></div>
    <button data-km="${l.p.id}">−</button><span>${l.q}</span><button data-kp="${l.p.id}">+</button></div>`).join('')+
  gLines().map(p=>`<div class="row">${p.img?`<img src="${esc(p.img)}" alt="">`:'<span style="width:54px"></span>'}<div><b>${esc(p.name)}</b><br><small>${fmt(+p.price||0)} · jeu (téléchargement)</small></div>
    <button data-gd="${esc(p.id)}">×</button></div>`).join('')+
  (kErr?`<div class="msg err" style="margin-top:8px">${esc(kErr)}</div>`:'')+
  (T.n?`<label style="display:block;margin:10px 0 0;cursor:pointer"><input type="checkbox" id="ktk" style="width:auto;margin:0 6px 0 0" ${kTrack?'checked':''}> Suivi La Poste pour les stickers (+${fmt(T.tkp)})</label>`:'')+
  `<div class="price" id="tot" style="margin-top:10px"></div><small id="det" style="display:block;color:var(--mut);margin-bottom:10px"></small>
   <div class="two"><input id="cn" placeholder="Nom complet"><input id="ce" type="email" placeholder="Email"></div>
   <input id="cp" type="tel" placeholder="Téléphone (facultatif)">
   <input id="ca" placeholder="Adresse"><div class="two"><input id="cz" placeholder="Code postal"><input id="cc" placeholder="Ville"></div>
   <input id="cy" placeholder="Pays (code, ex : FR)" value="FR" maxlength="2">
   <div id="omsg" style="margin:10px 0"></div><div id="pp"></div>`;
  Object.keys(FV).forEach(k=>{const el=$('#'+k);el.value=FV[k];el.oninput=()=>{FV[k]=el.value;if(k==='cy')updTotal()}});
  if($('#ktk'))$('#ktk').onchange=e=>{kTrack=e.target.checked;updTotal()};
  B.querySelectorAll('[data-gd]').forEach(b=>b.onclick=()=>{const c=readG();delete c[b.dataset.gd];writeG(c);renderCart();if(loadedG&&gLoaded)renderGames()});
  updTotal();mountPay();
  B.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=cart[b.dataset.m];if(--i.q<=0)cart.splice(b.dataset.m,1);save();renderCart()});
  B.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{cart[b.dataset.p].q++;save();renderCart()});
  B.querySelectorAll('[data-kp]').forEach(b=>b.onclick=()=>{const c=readK(),id=b.dataset.kp;c[id]=(c[id]||0)+1;writeK(c);renderCart()});
  B.querySelectorAll('[data-km]').forEach(b=>b.onclick=()=>{const c=readK(),id=b.dataset.km;c[id]=(c[id]||0)-1;if(c[id]<=0)delete c[id];writeK(c);renderCart()});
}

// Envoi de la commande au Créateur (collection "orders", statut "Nouvelle" = compteur du Créateur)
async function pushOrder(doc){
  let last;
  for(let t=0;t<3;t++){
    try{const F=await getFB();if(!F)throw new Error('Firestore indisponible');
      const r=await F.addDoc(F.collection(F.db,'orders'),{...doc,created:F.serverTimestamp()});return r.id.slice(0,8).toUpperCase()}
    catch(e){last=e;await new Promise(r=>setTimeout(r,1200*(t+1)))}
  }
  try{const q=JSON.parse(localStorage.getItem('wds_pending')||'[]');q.push(doc);localStorage.setItem('wds_pending',JSON.stringify(q))}catch(e){}
  throw last;
}
async function flushPending(){
  let q=[];try{q=JSON.parse(localStorage.getItem('wds_pending')||'[]')}catch(e){}
  if(!q.length)return;
  const F=await getFB();if(!F)return;
  const left=[];
  for(const d of q){try{await F.addDoc(F.collection(F.db,'orders'),{...d,created:F.serverTimestamp()})}catch(e){left.push(d)}}
  try{localStorage.setItem('wds_pending',JSON.stringify(left))}catch(e){}
}

      cart=[];save();writeK({});writeG({});if(loadedG&&gLoaded)renderGames();

setInterval(()=>{const n=$('#cnt');if(n)n.textContent=cart.reduce((a,i)=>a+i.q,0)+stkQty()+gQty()},700);
